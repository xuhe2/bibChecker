[project]
name = "bibchecker"
version = "0.1.0"
description = "Fetch BibTeX from Google Scholar by parsing .bib files"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "scholarly>=1.7.11",
    "python-dotenv>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
